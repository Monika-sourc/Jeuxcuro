<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; cursor: pointer; }
        #message { margin-top: 15px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Créer un compte</h2>
    <form id="signup-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
    </form>
    <div id="message"></div>

    <script>
        // ⚠️ REMPLACE ÇA par tes infos Supabase
        const SUPABASE_URL = 'TA_URL_ICI' 
        const SUPABASE_ANON_KEY = 'TA_CLE_ANON_ICI'

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        const form = document.getElementById('signup-form')
        const messageDiv = document.getElementById('message')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            messageDiv.textContent = 'Inscription en cours...'

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            })

            if (error) {
                messageDiv.className = 'error'
                messageDiv.textContent = 'Erreur: ' + error.message
            } else {
                messageDiv.className = 'success'
                messageDiv.textContent = 'Inscription réussie ! Vérifie ta boîte mail pour confirmer ton compte.'
            }
        })
    </script>
</body>
</html>
